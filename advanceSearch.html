<!DOCTYPE html>
<html lang="en">
    <head>
        <title>AdvanceSearch</title>
        <style>
            body{
                background-image: url("src/background.jpg");
                background-repeat : no-repeat ;
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                
            }
            h1{
                padding-bottom : 5px;
                padding-top:10px; 
                margin-left: -1668px;
                color: rgb(255, 255, 255);  
                text-align: center;
            }

            .search{
                font-size: 20px;
            }

            input[type="submit"] 
            {
                margin: 20px;
                width: 130px;
                height: 40px;
                background-color: #aecbfa;
                color : white;
                border : 0px solid black;
                text-align : center ;
                border-radius: 12px;
            }
            input:hover[type="submit"] , input:focus[type="submit"]
            {
                margin: 20px;
                width: 130px;
                height: 40px;
                color : white;
                background-color: #aecbfa;
                border : 2px solid black;
                text-align : center ;
                border-radius: 10px;
            }
            form  input[type="text"] , form input[type="text"]:focus{
                border : none;
                outline: none;
                background-color: white;
                width: 600px;
                height: 30px;
                padding:10px;
                margin:20px;
            }
            form 
            {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                padding-bottom: 200px;
            }

            span{
                padding : 3px;
                margin: 3px;
            }

            a{
                padding : 10px; 
                margin-right: 10px;
                color : rgb(255, 255, 255);
                position: absolute;
                right: 0;
                top: 0;
            }

            .continer{
                display: flex;
            }

            h5{
                color: rgb(255, 255, 255) ;
                padding-left: 50px ;
                padding-top: 20px;
                font-size: 30px;
                width: 300px;
                text-align: center;
            }
            
        </style>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    </head>
    <body>
        <a href="index.html" style="color:rgb(255, 255, 255)">Google Search</a>

        <h1 style="font-size: 60px; ">Google</h1>
        <h3 style="color: red ; padding-left: 50px ;font-size: 30px;">Advance</h3>

        <div >
            <form action="https://www.google.com/search" >
                <div class="continer">
                    <h5>all these words:</h5>
                    <input  type="text" name="as_q">
                </div>

                <div class="continer">
                    <h5>this exact word or phrase:</h5>
                    <input  type="text" name="as_epq">
                </div>

                <div class="continer">
                    <h5>any of these words:</h5>
                    <input  type="text" name="as_oq">
                </div>

                <div class="continer">
                    <h5>none of these words:</h5>
                    <input  type="text" name="as_eq">
                </div>
                    
                <input type="submit" value="Advance Search">
            </form>
        </div>


    </body>
</html>
