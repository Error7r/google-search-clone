<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ImageSearch</title>
        <style>
            body{
                background-image: url("src/background.jpg");
                background-repeat : no-repeat ;
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
                
            }
            h1{
                padding-bottom : 40px;
                color: rgb(255, 255, 255);  
                text-align: center;
            }

            .search{
                font-size: 20px;
            }
            input[class="searh-input"]{
                background-color :#f6f6f6;
            }

            input[type="submit"] 
            {
                margin: 20px;
                width: 130px;
                height: 40px;
                border : 0px solid black;
                text-align : center ;
                border-radius: 12px;
            }
            input:hover[type="submit"] , input:focus[type="submit"]
            {
                margin: 20px;
                width: 130px;
                height: 40px;
                border : 1px solid black;
                text-align : center ;
                border-radius: 10px;
            }
            form  input , form input:focus{
                border : none;
                outline: none;
                width: 600px;
                height: 20px;
            }
            form 
            {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                padding-bottom: 200px;
            }

            span{
                padding : 3px;
                margin: 3px;
            }

            a{
                padding : 10px; 
                margin-right: 10px;
                color : rgb(255, 255, 255);
                position: absolute;
                right: 0;
                top: 0;
            }
            
        </style>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    </head>
    <body>
        <a href="index.html" style="color:rgb(255, 255, 255)">Google Search</a>
        
        <div class="continer">
            <form action="https://www.google.com/search">
                <h1 style="font-size: 90px;">Google</h1>
                <h6 style="color:white ; position: absolute; margin-top: -80px; margin-left: 230px;">Image</h6>
                <div class="search">
                    <span class="search-icone material-symbols-outlined">search</span>
                    <input class="searh-input" placeholder="Search"  type="text" name="q">
                    <input type="hidden" name="tbm" value="isch">
                </div>
                <input type="submit" value="Google Search" >
            </form>
        </div>


    </body>
</html>
